name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Build firmware (${{ matrix.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        env: [esp32-s3-standard, arduino-nano-esp32, esp32-p4-eth, esp32-p4-eth-v1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          # The ESP32-S3 and ESP32-P4 toolchains differ
          key: platformio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: make build ENV=${{ matrix.env }}
      - name: Check the generated web assets are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::The build changed checked-in files. Run make build and commit the result."
            exit 1
          fi
      - name: Build with the example config.json
        if: matrix.env == 'esp32-s3-standard'
        run: cp config.example.json config.json && make build ENV=${{ matrix.env }}

  release-metadata:
    name: Release manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: |
          python scripts/release_package.py manifests --version v0.0.0 --out manifests
          python scripts/check_release_manifests.py --out manifests --version v0.0.0

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install platformio
      # test_nut_table checks NutTable.h against the NUT commit its citations are written for
      - name: Check out NUT at nut_repo.commit
        run: |
          git init -q nut_repo
          git -C nut_repo fetch -q --depth 1 https://github.com/networkupstools/nut "$(head -n1 nut_repo.commit | cut -d' ' -f1)"
          git -C nut_repo checkout -q FETCH_HEAD
      - run: make test
      - name: Arduino Nano ESP32 board profile tests
        run: pio test -e native-arduino-nano-esp32 -c .pio/native.ini

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/

  result:
    # The one check main requires, so jobs can change without editing the ruleset.
    # always(): a required check that is skipped after a failure counts as passing.
    name: CI result
    if: always()
    needs: [firmware, release-metadata, tests, e2e]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
