name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Build firmware
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: make build
      - name: Check the generated web assets are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::The build changed checked-in files. Run make build and commit the result."
            exit 1
          fi
      - name: Build with the example config.json
        run: cp config.example.json config.json && make build

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install platformio
      - run: make test

  result:
    # The one check main requires, so jobs can change without editing the ruleset.
    # always(): a required check that is skipped after a failure counts as passing.
    name: CI result
    if: always()
    needs: [firmware, tests]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
