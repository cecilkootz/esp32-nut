name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run -e esp32-s3-standard
        env:
          PLATFORMIO_BUILD_FLAGS: '-DFIRMWARE_VERSION=\"${{ github.ref_name }}\"'

      - name: Prepare Artifacts
        run: |
          mkdir release-pkg
          cp .pio/build/esp32-s3-standard/firmware.bin release-pkg/
          cp .pio/build/esp32-s3-standard/bootloader.bin release-pkg/
          cp .pio/build/esp32-s3-standard/partitions.bin release-pkg/
          # Empty otadata at 0xe000: after an odd number of OTA updates the board boots
          # from app1, and a full flash that skips it keeps starting the old firmware
          BOOT_APP0=$(find ~/.platformio/packages -path "*/tools/partitions/boot_app0.bin" | head -n 1)
          if [ -z "$BOOT_APP0" ]; then echo "boot_app0.bin not found" >&2; exit 1; fi
          cp "$BOOT_APP0" release-pkg/

          # Creazione manifest.json
          cat <<EOF > release-pkg/manifest.json
          {
            "name": "ESP32 NUT Server",
            "version": "${{ github.ref_name }}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "bootloader.bin", "offset": 0 },
                  { "path": "partitions.bin", "offset": 32768 },
                  { "path": "boot_app0.bin", "offset": 57344 },
                  { "path": "firmware.bin", "offset": 65536 }
                ]
              }
            ]
          }
          EOF
          
          cd release-pkg
          zip -r ../esp32-nut-${{ github.ref_name }}.zip *

      # docs/releases/<tag>.md is optional: when the tagged commit has it, it is
      # the release body; otherwise GitHub generates the notes from the merged PRs.
      # Notes written after the tag are applied by release-notes.yml.
      - name: Prepare release notes
        id: notes
        run: |
          NOTES="docs/releases/${{ github.ref_name }}.md"
          if [ -f "$NOTES" ]; then
            python scripts/release_notes.py "$NOTES" > release-body.md
            echo "body_path=release-body.md" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NOTES not found, using GitHub generated notes"
            echo "body_path=" >> "$GITHUB_OUTPUT"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.generate }}
          files: esp32-nut-${{ github.ref_name }}.zip

      - name: Prepare Web Installer
        run: |
          cp release-pkg/*.bin web-installer/
          cp release-pkg/manifest.json web-installer/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web-installer
